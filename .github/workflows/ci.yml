name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile all modules
        run: mvn -B -ntp compile

      - name: Run unit & integration tests
        # ubuntu-latest ships with Docker pre-installed and running, so the
        # Testcontainers-based tests (LedgerTransactionServiceTest,
        # PaymentIngestionServiceTest) work here without the Docker Desktop
        # pipe/TCP configuration this project needed on Windows locally.
        run: mvn -B -ntp test

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*'
          retention-days: 7

      - name: Build Docker images
        # Builds all three services via docker-compose.yml's build config —
        # no registry push, just proving each Dockerfile actually produces
        # a working image from a clean checkout.
        run: docker compose build
