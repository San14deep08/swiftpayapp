# For a real deployment, create this with `kubectl create secret generic`
# instead of committing credentials in YAML — this plaintext form is kept
# only for local/Minikube demo parity with docker-compose.yml's inline
# credentials, which have the exact same limitation.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: swiftpay
type: Opaque
stringData:
  POSTGRES_USER: swiftpay
  POSTGRES_PASSWORD: swiftpay
  POSTGRES_DB: swiftpay
