# Single-broker KRaft mode, same as docker-compose.yml. Simpler listener
# setup than the compose file needed: in-cluster DNS means every client
# (app pods and this broker itself) reaches it the same way, so there's no
# need for docker-compose's separate internal/external listener split.
#
# IMPORTANT: KAFKA_CONTROLLER_QUORUM_VOTERS uses "localhost", not the
# "kafka" Service name, even though this broker IS also the controller.
# Routing self-connection through a Kubernetes Service ("hairpin NAT") is
# unreliable on several CNI implementations — this caused a real crash loop
# during testing (BrokerLifecycleManager "Unable to register with the
# controller quorum" after ~60s of failed connection attempts to the
# Service's ClusterIP). docker-compose.yml doesn't have this problem
# because Docker's bridge network handles self-connection differently.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: swiftpay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.8.0
          ports:
            - containerPort: 9092
            - containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: CLUSTER_ID
              value: "swiftpay-local-kraft-cluster"
          readinessProbe:
            # timeoutSeconds is explicit and generous (default is 1s) because
            # this exec command spins up its own small JVM to connect and
            # query the broker — that alone can take several seconds, and
            # Kubernetes' 1s default falsely reported this as unhealthy,
            # eventually killing a Kafka instance that had actually started
            # fine (confirmed via `kubectl logs --previous`: clean startup,
            # then an external SIGTERM ~55s later, not a Kafka-side crash).
            exec:
              command: ["/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: swiftpay
spec:
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
